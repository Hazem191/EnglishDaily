<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankings - Daily English</title>
    <link rel="icon" href="gemini-svg.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/db-service.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/ui-sync.js" defer></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="brand">
                <img src="gemini-svg.svg" alt="Daily English" class="brand-logo-full" id="brand-logo">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link" data-en="Home" data-ar="الرئيسية">Home</a>
                <div class="d-flex align-items-center gap-2">
                    <button class="control-btn" id="theme-toggle">🌙</button>
                    <button class="control-btn" id="lang-toggle">AR</button>
                    <a href="login.html" class="btn btn-primary btn-sm ms-2" id="nav-btn" data-en="Sign In"
                        data-ar="دخول">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top:120px; padding-bottom:80px;">

        <!-- Header -->
        <div class="text-center mb-5 animate-up">
            <h1 class="hero-title mb-2" style="font-size:2rem;" data-en="Class rankings"
                data-ar="ترتيب الفصل">Class rankings</h1>
            <p class="text-muted"
                data-en="Total points from daily quizzes. Updated as students submit."
                data-ar="مجموع النقاط من الاختبارات اليومية. يتحدث عند تسليم الطلاب.">Total points from daily quizzes. Updated as students submit.</p>
        </div>

        <!-- Podium (top 3) -->
        <div class="podium animate-up delay-2" id="podium-container" style="margin-bottom:60px;">
            <div class="text-center w-100 py-5">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Full table -->
        <div id="leaderboard-container">
            <!-- Rendered by leaderboard.js -->
        </div>

    </main>

    <script>
        DB.initPromise.then(() => {
            const user = auth.currentUser;
            const btn = document.getElementById('nav-btn');
            if (user && btn) {
                const d = DB.get();
                btn.href = d.users?.admins?.[user.uid] ? 'teacher.html' : 'student.html';
                btn.setAttribute('data-en', 'Dashboard');
                btn.setAttribute('data-ar', 'لوحة التحكم');
                if (window.ui) ui.translate(document.body);
            }
        });
    </script>

</body>

</html>
