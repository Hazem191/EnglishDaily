<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Daily English</title>
    <link rel="icon" href="gemini-svg.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/db-service.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-sync.js" defer></script>
</head>

<body class="auth-page">

    <nav class="navbar">
        <div class="container nav-content px-0">
            <a href="index.html" class="brand">
                <img src="gemini-svg.svg" alt="Daily English" class="brand-logo-full" id="brand-logo">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link" data-en="Home" data-ar="الرئيسية">Home</a>
                <div class="d-flex align-items-center gap-2">
                    <button class="control-btn" id="theme-toggle">🌙</button>
                    <button class="control-btn" id="lang-toggle">AR</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-card animate-up" style="margin-top:40px; border-color: var(--secondary);">
        <div class="auth-header text-center">
            <div class="auth-logo"
                style="background: var(--secondary); border-radius: 50%; width: 50px; height: 50px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff;">
                A</div>
            <h2 data-en="Teacher sign in" data-ar="دخول المعلم">Teacher sign in</h2>
            <p class="text-muted" data-en="For teachers and administrators only." data-ar="للمعلمين والإداريين فقط.">
                For teachers and administrators only.</p>
        </div>

        <form id="admin-login-form">
            <div class="form-group" style="margin-bottom:24px;">
                <label class="form-label" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
                <input type="email" id="admin-email" class="form-input" placeholder="admin@domain.com" required>
            </div>
            <div class="form-group" style="margin-bottom:32px;">
                <label class="form-label" data-en="Secure Password" data-ar="كلمة السر">Secure Password</label>
                <div class="pass-wrapper">
                    <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="pass-toggle" onclick="togglePasswordView('admin-password', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="admin-error" class="form-error"></div>
            <button type="submit" class="btn btn-primary btn-lg w-100" data-en="Sign in"
                data-ar="دخول">Sign in</button>
        </form>

        <div class="text-center mt-4">
            <a href="login.html" class="text-dim small" data-en="← Back to Student Login"
                data-ar="← العودة لدخول الطلاب">← Back to Student Login</a>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('admin-error');
            const btn = e.target.querySelector('button');

            errorEl.textContent = '';
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner spinner-sm"></div> Accessing...';

            try {
                console.log("🔐 Proccessing admin login for:", email);
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;

                const snap = await rtdb.ref(`users/admins/${uid}`).once('value');
                if (snap.exists()) {
                    showToast('Signed in.', 'success');
                    setTimeout(() => window.location.href = 'teacher.html', 600);
                } else {
                    console.warn("⛔ Unauthorized: UID not in admin list", uid);
                    errorEl.textContent = 'Unauthorized: Administrative access only.';
                    auth.signOut();
                    btn.disabled = false; btn.textContent = 'Enter Dashboard';
                }
            } catch (error) {
                console.error('Admin Login error:', error);
                errorEl.textContent = 'Invalid email or password.';
                btn.disabled = false; btn.textContent = 'Enter Dashboard';
            }
        });
    </script>
</body>

</html>
