<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Daily English</title>
    <link rel="icon" href="gemini-svg.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/style.css">


    <script src="js/db-service.js"></script>
    <script src="js/student.js"></script>
    <script src="js/ui-sync.js" defer></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="brand">
                <img src="gemini-svg.svg" alt="Daily English" class="brand-logo-full" id="brand-logo">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link" data-en="Home" data-ar="الرئيسية">Home</a>
                <a href="leaderboard.html" class="nav-link" data-en="Rankings" data-ar="الترتيب">Rankings</a>
                <div class="d-flex align-items-center gap-3">
                    <div class="score-display-pill d-none d-md-flex">
                        <div class="pulse-dot"></div>
                        <span id="nav-score-display" style="font-weight:700; font-size:0.85rem; color:var(--primary);">0
                            pts</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="control-btn" id="theme-toggle">🌙</button>
                        <button class="control-btn" id="lang-toggle">AR</button>
                    </div>
                    <button onclick="auth.signOut()" class="btn btn-outline btn-sm" data-en="Sign Out"
                        data-ar="خروج">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px; padding-bottom: 80px;">

        <!-- Header -->
        <header class="animate-up" style="margin-bottom: 48px;">
            <div class="flex-between flex-wrap gap-20">
                <div>
                    <h1 id="welcome-msg" class="hero-title mb-1" style="font-size:2rem; font-weight:700;">Welcome</h1>
                    <p class="text-muted" data-en="Today's quiz takes about five minutes."
                        data-ar="اختبار اليوم يستغرق حوالي خمس دقائق.">Today's quiz takes about five minutes.</p>
                </div>
            </div>
        </header>

        <!-- Tabs -->
        <div class="tab-container animate-up" style="animation-delay:0.1s;">
            <button class="tab-btn active" id="tab-quiz" onclick="switchTab('quiz')" data-en="Daily quiz"
                data-ar="اختبار اليوم">Daily quiz</button>
            <button class="tab-btn" id="tab-profile" onclick="switchTab('profile')" data-en="Profile"
                data-ar="الملف الشخصي">Profile</button>
        </div>

        <!-- ── QUIZ SECTION ── -->
        <div id="quiz-section" class="tab-content animate-up" style="animation-delay:0.2s;">
            <div id="progress-area" class="hidden" style="margin-bottom: 32px;">
                <div class="flex-between mb-2">
                    <span id="q-counter" style="font-weight:800; color:var(--primary); font-size:1.1rem;">1 / 5</span>
                    <div class="d-flex align-items-center gap-3">
                        <span id="quiz-timer" class="quiz-timer" data-en="5:00 left" data-ar="5:00 متبقية">5:00</span>
                        <span id="q-type-badge" class="tag"
                            style="background:var(--primary); color:#fff; border:none; padding:4px 12px;">Grammar</span>
                    </div>
                </div>
                <div class="progress-wrapper" style="height:10px; background:var(--border);">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div id="quiz-area">
                <div class="quiz-card text-center" style="padding: 60px 40px;">
                    <div class="spinner"></div>
                    <p class="text-muted mt-3" data-en="Fetching your daily challenge..."
                        data-ar="جاري جلب تحدي اليوم...">Fetching your daily challenge...</p>
                </div>
            </div>
        </div>

        <!-- ── PROFILE SECTION ── -->
        <div id="profile-section" class="tab-content hidden">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="feature-card h-100">
                        <h3 class="mb-4" data-en="Account Information" data-ar="معلومات الحساب">Account Information</h3>
                        <div class="form-group">
                            <label class="form-label" data-en="Display Name" data-ar="الاسم المعروض">Display
                                Name</label>
                            <input type="text" id="profile-name" class="form-input" placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <label class="form-label" data-en="Email Address" data-ar="البريد الإلكتروني">Email
                                Address</label>
                            <input type="email" id="profile-email" class="form-input" disabled style="opacity:0.6;">
                        </div>
                        <button class="btn btn-primary w-100" onclick="updateProfile()" data-en="Save changes"
                            data-ar="حفظ التغييرات">Save changes</button>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="feature-card h-100"
                        style="background:rgba(99,102,241,0.02); border:1px dashed var(--primary);">
                        <h3 class="mb-4" data-en="Your Stats" data-ar="إحصائياتك">Your Stats</h3>
                        <div class="stats-grid" style="grid-template-columns:1fr; gap:16px;">
                            <div class="stats-card">
                                <span class="label" data-en="Total Points" data-ar="إجمالي النقاط">Total Points</span>
                                <span class="value gradient-text" id="stats-total-score">0</span>
                            </div>
                            <div class="stats-card">
                                <span class="label" data-en="Challenges Completed" data-ar="تحديات مكتملة">Challenges
                                    Completed</span>
                                <span class="value" id="stats-count">0</span>
                            </div>
                        </div>
                        <div class="text-center mt-4">
                            <a href="leaderboard.html" class="btn btn-outline w-100" data-en="View rankings"
                                data-ar="عرض الترتيب">View rankings</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

</body>

</html>
