<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Daily English</title>
    <link rel="icon" href="gemini-svg.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/db-service.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-sync.js" defer></script>
</head>

<body class="auth-page">

    <nav class="navbar">
        <div class="container nav-content px-0">
            <a href="index.html" class="brand">
                <img src="gemini-svg.svg" alt="Daily English" class="brand-logo-full" id="brand-logo">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link" data-en="Home" data-ar="الرئيسية">Home</a>
                <div class="d-flex align-items-center gap-2">
                    <button class="control-btn" id="theme-toggle" title="Toggle theme">Aa</button>
                    <button class="control-btn" id="lang-toggle">AR</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-card animate-up" style="margin-top:40px;">
        <div class="auth-header text-center">
            <h2 data-en="Student sign in" data-ar="دخول الطلاب">Student sign in</h2>
            <p class="text-muted" data-en="Use the account your teacher shared, or register if you're new." data-ar="استخدم الحساب الذي شاركه معلمك، أو سجّل إذا كنت جديداً.">Use the account your teacher shared, or register if you're new.</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" data-en="Login" data-ar="دخول">Login</button>
            <button class="auth-tab" id="tab-register" data-en="Register" data-ar="تسجيل">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" data-en="Email Address" data-ar="البريد الإلكتروني">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="name@example.com"
                    autocomplete="email" autocapitalize="none" autocorrect="off" inputmode="email" required>
            </div>
            <div class="form-group">
                <label class="form-label" data-en="Password" data-ar="كلمة السر">Password</label>
                <div class="pass-wrapper">
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••"
                        autocomplete="current-password" required>
                    <button type="button" class="pass-toggle" onclick="togglePasswordView('login-password', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-error" id="login-error"></div>
            <button type="submit" class="btn btn-primary btn-lg w-100" data-en="Sign in"
                data-ar="دخول">Sign in</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden">
            <div class="form-group">
                <label class="form-label" data-en="Full Name" data-ar="الاسم">Full Name</label>
                <input type="text" id="register-name" class="form-input" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label class="form-label" data-en="Email Address" data-ar="البريد الإلكتروني">Email Address</label>
                <input type="email" id="register-email" class="form-input" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" data-en="Create Password" data-ar="كلمة السر">Create Password</label>
                <input type="password" id="register-password" class="form-input" placeholder="Min 6 characters"
                    required>
            </div>
            <div class="form-group">
                <label class="form-label" data-en="Confirm Password" data-ar="تأكيد كلمة السر">Confirm Password</label>
                <input type="password" id="register-confirm-password" class="form-input" placeholder="Re-enter password"
                    required>
            </div>
            <input type="hidden" id="register-role" value="student">
            <div class="form-error" id="register-error"></div>
            <button type="submit" class="btn btn-primary btn-lg w-100" data-en="Create My Account"
                data-ar="إنشاء حسابي">Create My Account</button>
        </form>

        <div class="text-center mt-5 pt-3 border-top border-opacity-10">
            <a href="admin-login.html" class="text-primary fw-600" style="font-size: 0.9rem;"
                data-en="Teacher/Administrator Access →" data-ar="دخول المعلمين والمدراء ←">Teacher/Administrator Access
                →</a>
        </div>
    </div>

</body>

</html>
