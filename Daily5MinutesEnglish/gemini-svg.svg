<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Primary Blue Gradient -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Accent Orange Gradient -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <g transform="translate(0, -10)">
    <!-- Minimalist Timer/Clock Structure -->
    <g transform="translate(400, 190)">
      <!-- Clock Arc -->
      <path d="M 0,-80 A 80,80 0 1,0 60,-53" 
            fill="none" 
            stroke="url(#blue-grad)" 
            stroke-width="14" 
            stroke-linecap="round" />

      <!-- Top Crown / Button -->
      <rect x="-12" y="-102" width="24" height="12" rx="4" fill="url(#blue-grad)" />
      <rect x="-6" y="-90" width="12" height="10" fill="url(#blue-grad)" />

      <!-- Center Number "5" -->
      <text x="-2" y="26" 
            font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
            font-weight="900" 
            font-size="76" 
            fill="url(#blue-grad)" 
            text-anchor="middle">5</text>

      <!-- Upward Growth Arrow (Symbolizing daily progress & streak) -->
      <g transform="translate(68, -62) rotate(40)">
        <path d="M 0,25 L 0,-15 M -12,0 L 0,-15 L 12,0" 
              fill="none" 
              stroke="url(#orange-grad)" 
              stroke-width="12" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
      </g>
    </g>

    <!-- Brand Typography -->
    <text x="400" y="340" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif">
      <tspan font-weight="800" font-size="34" fill="#1E293B">DAILY </tspan>
      <tspan font-weight="900" font-size="34" fill="url(#orange-grad)">5</tspan>
      <tspan font-weight="800" font-size="34" fill="#1E293B"> ENGLISH</tspan>
    </text>

    <!-- Tagline -->
    <text x="400" y="375" text-anchor="middle" 
          font-family="'Inter', 'Segoe UI', sans-serif" 
          font-weight="600" 
          font-size="14" 
          fill="#64748B" 
          letter-spacing="3">
      SIMPLE DAILY LEARNING
    </text>
  </g>
</svg>
